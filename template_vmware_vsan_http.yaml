    discovery_rules:
    - uuid: 5ea74c7f2de5459993569589f29ecfe4
      name: vSAN cluster discovery
      type: DEPENDENT
      key: vsan.cluster.discovery
      filter:
        evaltype: AND
        conditions:
        - macro: "{#VSAN.NAME}"
          value: "{$VSAN.CLUSTER.MATCHES}"
        - macro: "{#VSAN.NAME}"
          value: "{$VSAN.CLUSTER.NOT_MATCHES}"
          operator: NOT_MATCHES_REGEX
      lifetime: 30d
      enabled_lifetime: 7d
      description: Discover vSAN-enabled clusters by vCenter managed object ID. Failed inventory is not treated as an empty result.
      item_prototypes:
      - uuid: 773efcc7a51348da90118451067e1c85
        name: 'vSAN [{#VSAN.NAME}]: Total capacity'
        type: DEPENDENT
